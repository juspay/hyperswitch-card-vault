[log.console]
enabled = true         # To enable logging in console
level = "DEBUG"        # level to be set for the logging framework
log_format = "default" # format to be used for logging default | json

[server]
host = "127.0.0.1" # The host that the server should be exposed to
port = 8080        # The port where the server should be hosted on

[limit]
request_count = 1 # The requests per duration
duration = 60     # duration to rate limit the delete api (in sec)


[cache]
tti = 7200          # Idle time after a get/insert of a cache entry to free the cache (in secs)
max_capacity = 5000 # Max capacity of a single table cache

[database]
username = "sam"   # username for the database
password = "damn"  # password of the database
host = "localhost" # the host where the database is hosted on
port = 5432        # the port of the database
dbname = "locker"  # the name of the database where the cards are stored
pool_size = 10          # optional: pool size for the database connection pool
max_lifetime = 120      # optional: max lifetime (in secs) of a pooled connection before it's recycled
min_idle = 2            # optional: minimum number of idle connections to maintain in the pool
idle_timeout = 300      # optional: idle timeout (in secs) for a pooled connection
connection_timeout = 10 # optional: timeout (in secs) for acquiring a connection from the pool

# Optional read replica
# [read_replica]
# username = "sam"   # username for the read replica database
# password = "damn"  # password of the read replica database
# host = "localhost" # the host where the read replica is hosted on
# port = 5432        # the port of the read replica database
# dbname = "locker"  # the name of the read replica database
# pool_size = 10          # optional: pool size for the read replica connection pool
# max_lifetime = 120      # optional: max lifetime (in secs) of a pooled connection before it's recycled
# min_idle = 2            # optional: minimum number of idle connections to maintain in the pool
# idle_timeout = 300      # optional: idle timeout (in secs) for a pooled connection
# connection_timeout = 10 # optional: timeout (in secs) for acquiring a connection from the pool

[secrets]
locker_private_key = "" # the locker private key to used used and the private key present with the tenant

[tenant_secrets]
# configure master_key and public_key for each tenant
# master_key - used for database encryption this could be aes encrypted by key custodian
# public_key - used for signature verification and encryption of response payload which is sent back to tenant
hyperswitch = { master_key = "feffe9928665731c6d6a8f9467308308feffe9928665731c6d6a8f9467308308", public_key = "", schema = "public", redis_key_prefix = "hyperswitch" }

# To protect secret/sensitive values like:
# - database.passwod
# - secrets.master_key
# - secrets.tenant_public_key
# - secrets.locker_private_key
#
# Following possible encryption schemes are used, only one of them can be active at a time, the sections are:
# - aws_kms (AWS KMS Symmetric Encryption)
# - hashi_corp_vault (HashiCorp Vault Secrets Engine KV version 2)
# - gcp_kms (GCP Cloud KMS Symmetric Encryption)

# Aws kms as secrets manager
# [secrets_management]
# secrets_manager = "aws_kms" # Secrets manager client to be used

# Required only if `secrets_manager` above is set to "aws_kms"
# [secrets_management.aws_kms]
# key_id = "kms_key_id" # The AWS key ID used by the KMS SDK for decrypting data.
# region = "kms_region" # The AWS region used by the KMS SDK for decrypting data.

# HashiCorp vault as secrets manager
# [secrets_management]
# secrets_manager = "hashi_corp_vault" # Secrets manager client to be used

# Required only if `secrets_manager` above is set to "hashi_corp_vault"
# [secrets_management.hashi_corp_vault]
# url = "http://127.0.0.1:8200" # The URL of the hosted HashiCorp vault
# token = "hvs.abc" # The secret token to access and communicate with the vault

# GCP KMS as secrets manager
# [secrets_management]
# secrets_manager = "gcp_kms" # Secrets manager client to be used

# Required only if `secrets_manager` above is set to "gcp_kms"
# [secrets_management.gcp_kms]
# project_id = "gcp_project_id"       # The GCP project ID that owns the KMS key ring.
# location_id = "gcp_kms_location_id" # The location ID of the KMS key ring, e.g. "global", "us-east1".
# key_ring_id = "gcp_kms_key_ring_id" # The ID of the KMS key ring.
# key_id = "gcp_kms_key_id"           # The ID of the KMS key used to decrypt data.

# TLS server within axum
[tls]
certificate = "cert.pem" # path to the certificate file (`pem` format)
private_key = "key.pem"  # path to the private key file (`pem` format)

# Api client
[api_client]
client_idle_timeout = 90    # timeout for idle sockets being kept-alive
pool_max_idle_per_host = 10 # maximum idle connection per host allowed in the pool.
identity = ""               # identity to be used for client certificate authentication in mtls.

# External key manager configuration
[external_key_manager]
mode = "disabled"  # Options: "disabled", "enabled", "enabled_with_mtls"

# Required when mode is "enabled" or "enabled_with_mtls"
# url = "https://external-key-manager.example.com"

# Required when mode is "enabled_with_mtls"
# ca_cert = """
# -----BEGIN CERTIFICATE-----
# ...
# -----END CERTIFICATE-----
# """

# Redis configuration (only used with the `redis` feature)
[redis]
host = "127.0.0.1"                 # Redis server host
port = 6379                        # Redis server port
pool_size = 5                      # number of connections in the pool
reconnect_max_attempts = 0         # max reconnection attempts (0 = retry forever)
reconnect_delay = 200              # delay between reconnection attempts (milliseconds)
default_ttl = 300                  # default key TTL (seconds)
default_hash_ttl = 900             # default hash-table TTL (seconds)
use_legacy_version = false         # use RESP2 instead of RESP3
stream_read_count = 1              # entries read per stream read
auto_pipeline = true               # automatically pipeline commands
broadcast_channel_capacity = 32    # pub/sub broadcast channel capacity
disable_auto_backpressure = false  # disable automatic backpressure
max_in_flight_commands = 5000      # max in-flight commands before backpressure (0 = disabled)
default_command_timeout = 30       # command timeout (seconds)
unresponsive_timeout = 10          # mark a connection unresponsive after (seconds)
unresponsive_check_interval = 2    # how often to check for unresponsiveness (seconds)
max_feed_count = 200               # max commands fed to the server at once
max_failure_threshold_seconds = 5  # max seconds Redis may be unreachable before it's failed

# KV (write-through Redis) configuration — global drainer settings (only used with the `kv` feature)
[kv]
drainer_stream_suffix = "DRAINER_STREAM"  # suffix for the drainer stream name
drainer_num_partitions = 16        # number of shard partitions (must be > 0)
ttl_for_kv = 900                   # TTL for KV entries in Redis (seconds)

# KV enablement is controlled SOLELY at runtime via the runtime-config endpoint (see
# [runtime_config] below).  The TOML value under [runtime_config.kv_config] is a seed
# written only when the row is absent — it is never a read-path fallback, so a store
# outage fails closed to "disabled" (all reads/writes go to Postgres) rather than to the
# seeded value.  The `kv_config` entry holds:
#   {"enable_kv": "disabled" | "enabled" | "soft_kill", "use_replica": true | false}
#   "enabled"   → write-through Redis (writes → Redis + drainer; reads → Redis-first)
#   "soft_kill" → gradual rollout (inserts → Postgres, reads → Redis-first)

# Per-tenant `redis_key_prefix` (under `[tenant_secrets.<id>]`) MUST be non-empty
# and unique across tenants whenever KV is enabled, otherwise the service fails to
# start. It must not contain `{` or `}` because KV data keys and drainer streams
# use `{shard_N}` as the Redis Cluster hash tag. The drainer must consume the
# prefixed `{prefix}:{shard_N}_DRAINER_STREAM` for each tenant; KV data for that
# shard is stored under `{prefix}:{shard_N}:<partition-key>` so both keys route to
# the same Redis Cluster slot.

# Metrics configuration: export metrics for monitoring.
# - disabled: no metrics exported
# - otlp: configure endpoint, endpoint_timeout_secs, metrics_export_interval_secs
# - prometheus: configure host, port (scraped at /metrics on a separate HTTP server)
[metrics]
mode = "otlp" # Options: "disabled", "otlp", "prometheus"

# When mode is "otlp", configure endpoint, endpoint_timeout_secs and metrics_export_interval_secs:
endpoint = "http://localhost:4317"               # OTLP gRPC endpoint
endpoint_timeout_secs = 10                       # OTLP exporter connection timeout (seconds)
metrics_export_interval_secs = 60                # How often to export metrics (seconds)
background_metrics_collection_interval_secs = 15 # How often to collect metrics in the background (in secs)

# When mode is "prometheus", configure host and port:
# host = "127.0.0.1"                               # IP address the Prometheus HTTP server binds to
# port = 9090                                      # Port the Prometheus HTTP server listens on
# background_metrics_collection_interval_secs = 15 # How often to collect metrics in the background (in secs)

# Runtime configuration stored locally in the per-tenant `configs` Postgres table
# and read-through a per-tenant Redis cache. No polling.
#
# The runtime config source of truth is the per-tenant `configs` table
# (created by migration 2026-08-17-120000_create_configs_table), which holds one row
# per runtime config keyed by its config key. Every key and its value struct are fixed
# at compile time by the `runtime_configs!` registry in `src/runtime_config.rs`.
#
# Enabled mode adds the admin API key that guards the `POST /runtime-config` update
# endpoint, plus one optional seed section per runtime config. A seed is written at
# startup only when that config's row is absent; it never overwrites a live value and
# is never used as a read-path fallback. Omitted seeds fall back to the struct default
# (KV disabled, replica off).

# [runtime_config]
# mode = "enabled"
# admin_api_key = "test_internal_admin_api_key"
#
# Seed for the `kv_config` entry, written only if the row does not exist yet:
# [runtime_config.kv_config]
# enable_kv = "disabled"   # "disabled" | "enabled" | "soft_kill"
# use_replica = false

# Update a runtime config via (`key` selects which config; `value` must match that
# config's struct — both are rejected at deserialization if they do not):
#   curl -X POST http://<host>:<port>/runtime-config \
#     -H "x-tenant-id: <tenant>" \
#     -H "x-internal-api-key: <admin_api_key>" \
#     -H "Content-Type: application/json" \
#     -d '{"key":"kv_config","value":{"use_replica":true,"enable_kv":"enabled"}}'
